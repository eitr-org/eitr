# Build-local policy: preserve compiler/user settings without debug split packages.
source "${EITR_BASE_MAKEPKG_CONF:-/etc/makepkg.conf}"
for eitr_fragment in "${EITR_BASE_MAKEPKG_CONF:-/etc/makepkg.conf}.d/"*.conf; do
  [[ ! -r "$eitr_fragment" ]] || source "$eitr_fragment"
done
if [[ -r "${XDG_CONFIG_HOME:-$HOME/.config}/pacman/makepkg.conf" ]]; then
  source "${XDG_CONFIG_HOME:-$HOME/.config}/pacman/makepkg.conf"
elif [[ -r "$HOME/.makepkg.conf" ]]; then
  source "$HOME/.makepkg.conf"
fi
eitr_options=()
for eitr_option in "${OPTIONS[@]}"; do
  [[ ${eitr_option#!} == debug ]] || eitr_options+=("$eitr_option")
done
OPTIONS=("${eitr_options[@]}" '!debug')
unset eitr_fragment eitr_option eitr_options
