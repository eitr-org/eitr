# The login screen draws on its main thread. On NVIDIA, Qt's render thread crashed
# inside the driver when SDDM started the greeter again after a logout, leaving a
# black screen (SDDM does not restart a crashed greeter).
[General]
GreeterEnvironment=QSG_RENDER_LOOP=basic

# Applies every keyboard layout before the greeter starts, so the login screen can switch them.
[X11]
DisplayCommand=/usr/lib/eitr/sddm-xsetup
