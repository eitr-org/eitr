# Session-wide toolkit environment loaded by hyprland.lua.
# Light/dark GTK appearance follows the gsettings color-scheme and
# gtk-theme that walker/scripts/themes/system.sh writes on every theme switch,
# so no GTK_THEME or ADW_DEBUG_COLOR_SCHEME override is forced here.

# system.sh writes matching qt5ct.conf and qt6ct.conf; Dolphin and other
# KDE Frameworks 6 apps load the Qt 6 platform theme.
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_STYLE_OVERRIDE,kvantum

env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
