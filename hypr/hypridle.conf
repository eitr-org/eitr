general {
    lock_cmd = eitr-run quickshell/lockscreen/scripts/launch.sh lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    # Delay sleep until a session-lock surface (Quickshell or Hyprlock) is up.
    inhibit_sleep = 3
}

listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1800
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 3600
    on-timeout = systemctl suspend
}
