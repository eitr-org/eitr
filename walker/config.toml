force_keyboard_focus = true
selection_wrap = true
theme = "current"
minwidth = 700
hide_action_hints = false
hide_action_hints_dmenu = false
hide_return_action = false
keybind_symbols = false
hide_quick_activation = true

[placeholders]
"default" = { input = "Search...", list = "No Results" }
"menus:apps" = { input = "Search apps...", list = "No Apps" }
"menus:main" = { input = "Find...", list = "No Menu Items" }

[providers]
max_results = 256
default = [ "menus:apps" ]

[keybinds]
close = ["Escape"]
quick_activate = []

[providers.actions]
"menus:apps" = [
  { action = "open", label = "Open", bind = "Return", default = true, after = "Close" },
  { action = "app_uninstall", label = "Uninstall", bind = "Delete", after = "Close" },
  { action = "menus:parent", label = "back", bind = "shift BackSpace", after = "Nothing" },
]
"menus:install" = [
  { action = "open", label = "Install", bind = "Return", default = true, after = "Close" },
